name: Deploy (p3-domain-intelligence)

on:
  push:
    branches: ["master"]
    paths: ["products/p3-domain-intelligence/**"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/p3-domain-intelligence
    # Requires two repo secrets, added by the account owner (Settings > Secrets
    # and variables > Actions): CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
    # This session cannot create GitHub secrets itself — see docs/architecture-discovery.md.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci --legacy-peer-deps

      - run: npm run typecheck

      - run: npm test

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: products/p3-domain-intelligence
          command: deploy
